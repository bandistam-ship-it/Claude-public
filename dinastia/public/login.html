<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dinastia ta</title>
<link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"></head>
<body><main style="display:block;max-width:360px;padding-top:15vh"><section class="card"><h1>Dinastia ta</h1>
<form id="f"><label>Parola<br><input type="password" id="p" style="width:100%;margin:8px 0" autofocus></label><button>Intră</button><p class="warn" id="e"></p></form></section></main>
<script>f.onsubmit=async(ev)=>{ev.preventDefault();const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});if(r.ok)location.href='/';else e.textContent='Parolă greșită';};</script></body></html>
