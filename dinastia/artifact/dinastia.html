header{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:1.6rem;letter-spacing:.04em;color:var(--gold)}
h2{margin:0 0 8px;font-size:1.05rem;color:var(--gold)}
.sub{color:var(--muted);font-size:.9rem}
.rank{text-align:right}.rank b{display:block;font-size:1.2rem}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding-top:16px;max-width:1300px;margin:auto}

.map-wrap{background:radial-gradient(circle,#3a2f1e,#241c12);border:1px solid var(--line);border-radius:10px;padding:8px}
#map{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);padding:6px 8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
aside{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.bar{height:8px;background:var(--bar);border-radius:4px;overflow:hidden;margin:4px 0 10px}
.bar>i{display:block;height:100%;background:var(--gold)}
button{font:inherit;background:var(--gold);color:#1b1610;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ev{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0;font-size:.92rem}
.ev.good{border-color:var(--sport)}.ev.bad,.ev.loss{border-color:var(--lost)}.ev.conquest,.ev.rank{border-color:var(--gold)}.ev.death{border-color:#000;background:#150f0a}
.ev small{color:var(--muted);display:block}
.warn{color:#e9a96a;font-size:.92rem}
.sector{cursor:pointer;stroke:#14100b;stroke-width:2}
.sector:hover{filter:brightness(1.25)}.sector.sel{stroke:var(--gold);stroke-width:4}
.lbl{fill:#fff;font-size:11px;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#000a;stroke-width:3px}
.lbl.small{font-size:9px}
#status{padding:24px 0;text-align:center}

// Calcule de saptamana si scor (functii pure, usor de testat).

function mondayOf(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  const day = (d.getDay() + 6) % 7; // luni = 0
  d.setDate(d.getDate() - day);
  return d;
}

function weekRange(date = new Date()) {
  const start = mondayOf(date);
  const end = new Date(start);
  end.setDate(end.getDate() + 7);
  return { start, end };
}

// Cheie ISO de saptamana, ex. 2026-W47
function weekKey(date = new Date()) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const week = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
  return `${d.getUTCFullYear()}-W${String(week).padStart(2, '0')}`;
}

function taskPoints(task, scoreCfg) {
  for (const l of task.labels || []) {
    const p = scoreCfg.labelPoints[String(l).toLowerCase()];
    if (p) return p;
  }
  return scoreCfg.priorityPoints[String(task.priority || 1)] ?? 1;
}

// tasks: [{domain, points}] -> { score, domains: {d:{points,count,ratio}} }
function scoreWeek(tasks, scoreCfg) {
  const domains = {};
  for (const d of DOMAINS) domains[d] = { points: 0, count: 0, ratio: 0 };
  for (const t of tasks) {
    if (!domains[t.domain]) continue;
    domains[t.domain].points += t.points;
    domains[t.domain].count += 1;
  }
  let total = 0;
  for (const d of DOMAINS) {
    const share = scoreCfg.domainShare[d];
    const ratio = domains[d].points / (scoreCfg.weeklyTargetPoints * share);
    domains[d].ratio = Math.round(ratio * 100) / 100;
    total += Math.min(1, ratio) * share;
  }
  return { score: Math.max(1, Math.min(10, Math.round(1 + 9 * total))), domains };
}

// Pentru introducere manuala: ratii 0..1 pe domeniu, fara Todoist.
function manualWeek(ratios, scoreCfg) {
  const domains = {};
  let total = 0;
  for (const d of DOMAINS) {
    const r = Math.max(0, Number(ratios?.[d] ?? 0));
    domains[d] = { points: 0, count: 0, ratio: Math.round(r * 100) / 100 };
    total += Math.min(1, r) * scoreCfg.domainShare[d];
  }
  return { score: Math.max(1, Math.min(10, Math.round(1 + 9 * total))), domains };
}

// Logica jocului. Functii care muteaza un obiect `state` si intorc evenimentele noi.

const START_RECOGNITION = 50;

function newState(now = new Date()) {
  return {
    version: 1,
    createdAt: now.toISOString(),
    dynasty: { generation: 1, name: 'Dinu', trait: null, bornAt: now.toISOString() },
    rank: 0,
    conquered: {},        // id -> { at }
    lost: {},             // id -> { rival, at }
    territoryStart: {},   // id -> ISO, de cand conteaza progresul
    recognition: Object.fromEntries(DOMAINS.map((d) => [d, START_RECOGNITION])),
    history: [],          // saptamani inchise
    lowStreak: 0,
    journal: [],
    ancestors: [],
    lastEvents: {}        // anti-repetitie
  };
}

const groupOf = (rank) => RANKS[Math.min(rank, RANKS.length - 1)].group;
const byId = (terrs) => Object.fromEntries(terrs.map((t) => [t.id, t]));
const log = (state, now, kind, text, extra = {}) => {
  const ev = { at: now.toISOString(), kind, text, rank: RANKS[state.rank].name, generation: state.dynasty.generation, ...extra };
  state.journal.push(ev);
  return ev;
};

// Un task bifat conteaza pentru teritoriu daca are [Nume], #id in titlu sau eticheta cu id-ul.
function hasTag(task, t) {
  const c = (task.content || '').toLowerCase();
  return c.includes(`[${t.name.toLowerCase()}]`) || c.includes(`[${t.id}]`) || c.includes(`#${t.id}`) || (task.labels || []).includes(t.id);
}

const isAvailable = (t, state) => t.tier <= state.rank + 1 && !t.sketchLocked;
const startOf = (state, t) => state.territoryStart[t.id] || state.createdAt;

// Progres catre tinta unui teritoriu. ctx.tasks = task-uri bifate (cu completedAt, domain, id)
function evaluate(t, state, ctx = { tasks: [] }) {
  const since = new Date(startOf(state, t));
  const tagDone = ctx.tasks.some((x) => hasTag(x, t) && new Date(x.completedAt) >= since);
  let progress = 0, goal = 1;
  switch (t.type) {
    case 'streak': {
      goal = t.weeks;
      const h = state.history.filter((w) => new Date(w.closedAt) >= since);
      for (let i = h.length - 1; i >= 0 && h[i].score >= t.minScore; i--) progress++;
      break;
    }
    case 'taskCount': {
      goal = t.count;
      progress = ctx.tasks.filter((x) => x.domain === t.domain && new Date(x.completedAt) >= since).length;
      break;
    }
    case 'weeklyDomain': {
      goal = t.weeks;
      progress = state.history.filter((w) => new Date(w.closedAt) >= since && (w.domains?.[t.domain]?.count ?? 0) >= t.minTasks).length;
      break;
    }
    default:
      progress = 0; goal = 1;
  }
  const done = tagDone || (t.type !== 'tag' && progress >= goal);
  return { progress: done ? goal : Math.min(progress, goal), goal, done };
}

function conquer(state, t, now, events) {
  delete state.lost[t.id];
  state.conquered[t.id] = { at: now.toISOString() };
  const flavor = CONQUEST_FLAVOR[t.tier] || '';
  events.push(log(state, now, 'conquest', `${t.name} e al tău. ${flavor}`.trim(), { territory: t.id }));
}

function promote(state, terrs, now, events) {
  while (state.rank < RANKS.length - 1) {
    const n = state.rank + 1;
    const tier = terrs.filter((t) => t.tier === n && !t.sketch);
    const sketch = terrs.filter((t) => t.tier === n);
    if (!tier.length && sketch.length) break;       // doar schita: nu promovam pana nu e scrisa
    if (!tier.length || !tier.every((t) => state.conquered[t.id])) break;
    state.rank = n;
    events.push(log(state, now, 'rank', `Ai devenit ${RANKS[n].name}.`));
  }
}

// Verifica teritoriile disponibile; cucereste ce are tinta atinsa si promoveaza.
function checkConquests(state, terrs, ctx, now = new Date()) {
  const events = [];
  const sorted = [...terrs].sort((a, b) => a.tier - b.tier);
  for (const t of sorted) {
    if (state.conquered[t.id] || !isAvailable(t, state)) continue;
    if (t.sketch && !t.target) continue;
    if (evaluate(t, state, ctx).done) { conquer(state, t, now, events); promote(state, terrs, now, events); }
  }
  return events;
}

const holdTiers = (rank) => (rank <= 1 ? [2] : [rank]);

function demoteIfEmpty(state, terrs, now, events) {
  while (state.rank >= 1) {
    const held = terrs.filter((t) => holdTiers(state.rank).includes(t.tier) && state.conquered[t.id]);
    if (held.length) return;
    if (state.rank === 1 && state.conquered.obor) {
      delete state.conquered.obor;
      state.territoryStart.obor = now.toISOString();
    }
    state.rank -= 1;
    events.push(log(state, now, 'rank', `Ai coborât la rangul ${RANKS[state.rank].name}.`));
    if (state.rank === 0) return;
  }
}

function pick(arr, rng) { return arr[Math.floor(rng() * arr.length) % arr.length]; }

function weakestDomain(domains, gap) {
  const r = DOMAINS.map((d) => [d, domains[d]?.ratio ?? 0]).sort((a, b) => a[1] - b[1]);
  return r[1][1] - r[0][1] >= gap ? r[0][0] : null; // null = nu e clar mai slab
}

function loseTerritory(state, terrs, domains, cfg, rng, now, events) {
  const conqueredList = terrs.filter((t) => state.conquered[t.id])
    .sort((a, b) => new Date(state.conquered[b.id].at) - new Date(state.conquered[a.id].at));
  if (!conqueredList.length) return false;
  const dom = weakestDomain(domains, cfg.loss.clearGap);
  const victim = (dom && conqueredList.find((t) => t.domain === dom)) || conqueredList[0];
  const rival = pick(RIVALS, rng);
  delete state.conquered[victim.id];
  state.territoryStart[victim.id] = now.toISOString();
  state.lost[victim.id] = { rival, at: now.toISOString() };
  const habit = HABIT[victim.domain] || 'săptămâna în mână';
  events.push(log(state, now, 'loss',
    `${rival} a pus stăpânire pe ${victim.name}. Boierii spun că nu l-ai fi lăsat dacă în luna trecută ți-ai fi ținut ${habit}.`,
    { territory: victim.id }));
  demoteIfEmpty(state, terrs, now, events);
  return true;
}

function domainEvent(state, kind, domain, rng, now, events) {
  const base = kind === 'fail' ? SOURCES : WINS;
  const vars = kind === 'fail' ? FAIL_VARIANTS : WIN_VARIANTS;
  const group = groupOf(state.rank);
  const options = [base[group][domain], ...(vars[group]?.[domain] || [])];
  const key = `${kind}:${group}:${domain}`;
  const last = state.lastEvents[key];
  const pool = options.map((_, i) => i).filter((i) => i !== last || options.length === 1);
  const idx = pool[Math.floor(rng() * pool.length) % pool.length];
  state.lastEvents[key] = idx;
  events.push(log(state, now, kind === 'fail' ? 'bad' : 'good', `${DOMAIN_NAMES[domain]}: ${options[idx]}`, { domain }));
}

function die(state, now, events) {
  const strongest = DOMAINS.map((d) => [d, state.recognition[d]]).sort((a, b) => b[1] - a[1])[0][0];
  const old = state.dynasty;
  state.ancestors.push({ generation: old.generation, name: old.name, diedAt: now.toISOString(), bestDomain: strongest });
  events.push(log(state, now, 'death', `${old.name} (generația ${old.generation}) s-a stins, iar numele lui rămâne în jurnalul dinastiei.`));
  const heirName = HEIR_NAMES[(old.generation) % HEIR_NAMES.length];
  state.dynasty = { generation: old.generation + 1, name: heirName, trait: { domain: strongest, bonus: 15 }, bornAt: now.toISOString() };
  state.rank = 0; state.conquered = {}; state.lost = {};
  state.territoryStart = {}; state.createdAt = now.toISOString(); state.lowStreak = 0;
  state.recognition = Object.fromEntries(DOMAINS.map((d) => [d, START_RECOGNITION + (d === strongest ? 15 : 0)]));
  events.push(log(state, now, 'heir', `${heirName} preia numele. Moștenește recunoaștere în ${DOMAIN_NAMES[strongest]} (+15).`));
}

// Inchide o saptamana. week = { key, score, domains:{d:{count,points,ratio}} }
function closeWeek(state, terrs, week, ctx, cfg, rng = Math.random, now = new Date()) {
  const events = [];
  state.lastEvents ||= {};
  if (state.history.some((w) => w.key === week.key)) throw new Error(`Săptămâna ${week.key} e deja închisă`);
  state.history.push({ key: week.key, score: week.score, domains: week.domains, closedAt: now.toISOString() });

  // recunoastere
  for (const d of DOMAINS) {
    const r = week.domains[d]?.ratio ?? 0;
    const delta = Math.round((Math.min(r, 1.2) - 0.5) * 16);
    state.recognition[d] = Math.max(0, Math.min(100, state.recognition[d] + delta));
  }
  state.lowStreak = week.score <= cfg.loss.scoreAtOrBelow ? state.lowStreak + 1 : 0;

  events.push(...checkConquests(state, terrs, ctx, now));

  const bad = week.score <= cfg.loss.scoreAtOrBelow;
  if (bad) loseTerritory(state, terrs, week.domains, cfg, rng, now, events);

  // evenimente de domeniu: cel mai slab si cel mai bun
  const ranked = DOMAINS.map((d) => [d, week.domains[d]?.ratio ?? 0]).sort((a, b) => a[1] - b[1]);
  const worst = ranked[0], best = ranked[ranked.length - 1];
  if (worst[1] < 0.5) domainEvent(state, 'fail', worst[0], rng, now, events);
  if (best[1] >= 0.7 && best[0] !== worst[0]) domainEvent(state, 'win', best[0], rng, now, events);

  // moartea
  if (state.rank === 0 && !Object.keys(state.conquered).length && state.lowStreak >= cfg.death.weeksAtOrBelow) die(state, now, events);
  return events;
}

const TERRS = [{"id":"obor","name":"Obor","tier":1,"domain":null,"target":"Trei săptămâni la rând cu scor de cel puțin 6 în raportul de duminică","type":"streak","weeks":3,"minScore":6},{"id":"colentina","name":"Colentina","tier":2,"domain":"drept","target":"20 de sesiuni de studiu pentru Barou bifate","type":"taskCount","count":20},{"id":"dorobanti","name":"Dorobanți","tier":2,"domain":"drept","target":"O sesiune de examene la Drept fără restanță","type":"tag"},{"id":"drumul-taberei","name":"Drumul Taberei","tier":2,"domain":"drept","target":"O săptămână cu 30 de grile rezolvate","type":"tag","proposed":true},{"id":"cotroceni","name":"Cotroceni","tier":2,"domain":"filosofie","target":"Un examen sau seminar de Filosofie promovat","type":"tag"},{"id":"cismigiu","name":"Cișmigiu","tier":2,"domain":"filosofie","target":"O lectură terminată pe lună, trei luni la rând","type":"tag"},{"id":"militari","name":"Militari","tier":2,"domain":"filosofie","target":"O lună de cursuri de Filosofie fără absență","type":"tag","proposed":true},{"id":"floreasca","name":"Floreasca","tier":2,"domain":"sport","target":"Opt săptămâni cu cel puțin trei antrenamente","type":"weeklyDomain","minTasks":3,"weeks":8},{"id":"centrul-vechi","name":"Centrul Vechi","tier":2,"domain":"sport","target":"Primul muscle-up strict din arborele de calistenie","type":"tag"},{"id":"pantelimon","name":"Pantelimon","tier":2,"domain":"sport","target":"Drumul Obor–centru cu skate-ul, fără să cobori","type":"tag"},{"id":"berceni","name":"Berceni","tier":2,"domain":"casa","target":"O lună cu toate task-urile de casă în termen","type":"tag"},{"id":"giulesti","name":"Giulești","tier":2,"domain":"casa","target":"Patru săptămâni cu cel puțin 3 treburi de casă bifate","type":"weeklyDomain","minTasks":3,"weeks":4,"proposed":true},{"id":"buftea","name":"Buftea","tier":3,"domain":"drept","target":"O simulare de Barou cu rezultat bun","type":"tag"},{"id":"chitila","name":"Chitila","tier":3,"domain":"drept","target":"O lună c const CFG = {"port":8787,"todoist":{"projectName":"The Realm","cacheSeconds":60},"score":{"weeklyTargetPoints":40,"domainShare":{"drept":0.4,"filosofie":0.2,"sport":0.25,"casa":0.15},"priorityPoints":{"1":1,"2":2,"3":3,"4":4},"labelPoints":{"easy":1,"medium":2,"hard":3,"boss-fight":5}},"domains":{"dreptLabels":["barou","grile","civil","penal","proccivila","procpenala","licenta","profesie"],"sectionToDomain":{"library":"filosofie","bonfire":"filosofie","barracks":"sport","keep":"casa"},"labelToDomain":{"body":"sport","upkeep":"casa","mind":"filosofie"}},"autoClose":{"enabled":true,"hour":21,"checkMinutes":10},"loss":{"scoreAtOrBelow":4,"clearGap":0.15},"death":{"weeksAtOrBelow":2}};

// ---- parametri: jocul se reface de la aceasta data, saptamana cu saptamana ----
const GAME_START = new Date(2026, 10, 16);                       // luni 16 nov 2026
const boundary = (i) => new Date(2026, 10, 22 + 7 * i, CFG.autoClose.hour, 0); // sfarsitul saptamanii i: duminica 21:00
const SERVER = 'Todoist';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const DOMAIN_COLOR = { drept: '#8c3b3b', filosofie: '#4b6a9b', sport: '#5d8a4a', casa: '#a8793a' };
const STATUS = { conquered: 'cucerit', available: 'disponibil', locked: 'încă închis', lost: 'pierdut' };
let selected = 'obor', model = null;

// ---- Todoist ----
function classify(task, sectionName) {
  const d = CFG.domains, labels = task.labels;
  if (labels.some((l) => d.dreptLabels.includes(l))) return 'drept';
  for (const l of labels) if (d.labelToDomain[l]) return d.labelToDomain[l];
  const sec = (sectionName || '').toLowerCase();
  for (const [k, v] of Object.entries(d.sectionToDomain)) if (sec.includes(k)) return v;
  return null;
}
async function fetchTasks(mcp) {
  const call = async (tool, input) => (await mcp.callTool(SERVER, tool, input)).payload;
  const proj = (await call('find-projects', { searchText: CFG.todoist.projectName })).projects
    .find((p) => p.name.toLowerCase() === CFG.todoist.projectName.toLowerCase());
  if (!proj) throw { code: 'no_project' };
  const sections = Object.fromEntries(((await call('find-sections', { projectId: proj.id })).sections || []).map((s) => [s.id, s.name]));
  const pad = (n) => String(n).padStart(2, '0');
  const t = new Date(Date.now() + 864e5);
  const until = `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`;
  const since = `${GAME_START.getFullYear()}-${pad(GAME_START.getMonth() + 1)}-${pad(GAME_START.getDate())}`;
  const out = []; let cursor;
  for (let page = 0; page < 20; page++) {
    const r = await call('find-completed-tasks', { projectId: proj.id, since, until, limit: 200, cursor });
    for (const x of r.tasks || []) {
      const labels = (x.labels || []).map((l) => String(l).toLowerCase());
      const task = { id: String(x.id), content: x.content || '', labels, priority: String(5 - Number(String(x.priority || 'p4').slice(1))), completedAt: x.completedAt };
      out.push({ ...task, domain: classify(task, sections[x.sectionId]), points: taskPoints(task, CFG.score), at: new Date(x.completedAt) });
    }
    if (!r.hasMore || !r.nextCursor) break;
    cursor = r.nextCursor;
  }
  return out;
}

// ---- reluarea jocului din istoricul Todoist ----
function seeded(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function compute(tasks, now) {
  const state = newState(GAME_START);
  let i = 0;
  for (; boundary(i) <= now; i++) {
    const lo = new Date(Math.max(+GAME_START, +boundary(i - 1))), hi = boundary(i);
    const wk = tasks.filter((t) => t.at >= lo && t.at < hi);
    const week = { key: `W${i}`, ...scoreWeek(wk, CFG.score) };
    closeWeek(state, TERRS, week, { tasks: tasks.filter((t) => t.at < hi) }, CFG, seeded(i * 7919 + 13), hi);
  }
  const ctx = { tasks };
  checkConquests(state, TERRS, ctx, now);
  const lo = new Date(Math.max(+GAME_START, +boundary(i - 1)));
  const current = scoreWeek(tasks.filter((t) => t.at >= lo), CFG.score);
  const territories = TERRS.map((t) => ({ ...t,
    status: state.conquered[t.id] ? 'conquered' : state.lost[t.id] ? 'lost' : isAvailable(t, state) ? 'available' : 'locked',
    rival: state.lost[t.id]?.rival || null, ...evaluate(t, state, ctx) }));
  return { state, territories, current, closesAt: boundary(i), weeksClosed: i, taskCount: tasks.length };
}

// ---- afisare (doar citire) ----
const RINGS = { 1: [0, 70], 2: [80, 175], 3: [185, 265], 4: [275, 350] };
const pol = (r, a) => [r * Math.cos(a), r * Math.sin(a)];
function sector(inner, outer, a0, a1) {
  if (inner === 0) return `M${-outer} 0 a${outer} ${outer} 0 1 0 ${2 * outer} 0 a${outer} ${outer} 0 1 0 ${-2 * outer} 0`;
  const [x0, y0] = pol(outer, a0), [x1, y1] = pol(outer, a1), [x2, y2] = pol(inner, a1), [x3, y3] = pol(inner, a0);
  const large = a1 - a0 > Math.PI ? 1 : 0;
  return `M${x0} ${y0} A${outer} ${outer} 0 ${large} 1 ${x1} ${y1} L${x2} ${y2} A${inner} ${inner} 0 ${large} 0 ${x3} ${y3} Z`;
}
function fillFor(t) {
  const c = t.domain ? DOMAIN_COLOR[t.domain] : '#c8a24a';
  if (t.status === 'conquered') return [c, 1];
  if (t.status === 'lost') return ['#7a1f1f', 0.95];
  if (t.status === 'available') return [c, 0.35];
  return ['#4a4234', 0.55];
}
function renderMap() {
  let out = '';
  for (const tier of [...new Set(model.territories.map((t) => t.tier))]) {
    const list = model.territories.filter((t) => t.tier === tier), [inner, outer] = RINGS[tier] || [0, 0];
    if (!outer) continue;
    const gap = list.length > 1 ? 0.03 : 0;
    list.forEach((t, i) => {
      const a0 = -Math.PI / 2 + (i / list.length) * 2 * Math.PI + gap, a1 = -Math.PI / 2 + ((i + 1) / list.length) * 2 * Math.PI - gap;
      const [fill, op] = fillFor(t), [lx, ly] = tier === 1 ? [0, 0] : pol((inner + outer) / 2, (a0 + a1) / 2);
      const flag = t.status === 'conquered' ? '⚑ ' : t.status === 'lost' ? '✕ ' : '';
      out += `<path class="sector ${selected === t.id ? 'sel' : ''}" data-id="${t.id}" d="${sector(inner, outer, a0, a1)}" fill="${fill}" fill-opacity="${op}"><title>${esc(t.name)} — ${STATUS[t.status]}</title></path>`;
      out += `<text class="lbl ${list.length > 8 ? 'small' : ''}" x="${lx}" y="${ly}" dy="4">${flag}${esc(t.name)}</text>`;
    });
  }
  $('map').innerHTML = out;
  $('map').querySelectorAll('.sector').forEach((el) => el.addEventListener('click', () => { selected = el.dataset.id; render(); }));
}
function renderTerritory() {
  const t = model.territories.find((x) => x.id === selected) || model.territories[0];
  const unit = { streak: 'săptămâni', taskCount: 'task-uri', weeklyDomain: 'săptămâni' }[t.type];
  let h = `<h2>${esc(t.name)} <span class="sub">· ${t.domain ? DOMAIN_NAMES[t.domain] : 'Țara întreagă'} · ${STATUS[t.status]}</span></h2><p>${esc(t.target)}</p>`;
  if (t.status === 'lost') h += `<p class="warn">Luat de ${esc(t.rival)}. Îl recucerești cu aceeași țintă.</p>`;
  if (unit) h += `<div class="sub">${t.progress} / ${t.goal} ${unit}</div><div class="bar"><i style="width:${t.goal ? Math.round(t.progress / t.goal * 100) : 0}%"></i></div>`;
  if (t.type === 'tag' && (t.status === 'available' || t.status === 'lost')) h += `<p class="sub">Se cucerește când bifezi în Todoist un task cu <b>[${esc(t.name)}]</b> în titlu.</p>`;
  if (t.status === 'locked') h += '<p class="sub">Se deschide când ajungi la un rang mai mare.</p>';
  $('territory').innerHTML = h;
}
function renderWeek() {
  const w = model.current, s = model.state;
  let h = `<h2>Săptămâna curentă</h2><div class="bar"><i style="width:${w.score * 10}%"></i></div><div>Scor până acum: <b>${w.score}/10</b></div>`;
  for (const d of DOMAINS) h += `<div class="sub">${DOMAIN_NAMES[d]}: ${w.domains[d].count} task-uri · ${Math.round(w.domains[d].ratio * 100)}%</div>`;
  h += `<p class="sub">Se închide singură ${model.closesAt.toLocaleDateString('ro-RO', { weekday: 'long' })} la ${CFG.autoClose.hour}:00.</p>`;
  const hist = s.history.slice(-8).map((x) => x.score).join(' · ');
  if (hist) h += `<div class="sub">Ultimele scoruri: ${hist}</div>`;
  $('week').innerHTML = h;
}
function renderRecognition() {
  $('recognition').innerHTML = '<h2>Recunoaștere</h2>' + DOMAINS.map((d) => `<div class="sub">${DOMAIN_NAMES[d]}: ${model.state.recognition[d]}</div><div class="bar"><i style="width:${model.state.recognition[d]}%;background:${DOMAIN_COLOR[d]}"></i></div>`).join('');
}
function renderJournal() {
  const s = model.state;
  let h = '<h2>Jurnalul dinastiei</h2>';
  if (s.ancestors.length) h += `<div class="sub">Strămoși: ${s.ancestors.map((a) => `${esc(a.name)} (gen. ${a.generation})`).join(', ')}</div>`;
  const items = s.journal.slice(-25).reverse();
  h += items.length ? items.map((e) => `<div class="ev ${e.kind}">${esc(e.text)}<small>${new Date(e.at).toLocaleDateString('ro-RO')} · ${esc(e.rank)} · gen. ${e.generation}</small></div>`).join('') : '<p class="sub">Povestea începe la prima închidere de săptămână.</p>';
  $('journal').innerHTML = h;
}
function render() {
  const s = model.state, r = RANKS[s.rank];
  $('who').textContent = `${s.dynasty.name}, generația ${s.dynasty.generation}` + (s.dynasty.trait ? ` · moștenire: +${s.dynasty.trait.bonus} ${DOMAIN_NAMES[s.dynasty.trait.domain]}` : '');
  $('rank').innerHTML = `<b>${esc(r.name)}</b><span class="sub">Următorul pas: ${esc(r.next)}${STEP_FACTORS[s.rank] ? ` · dificultate ×${STEP_FACTORS[s.rank]}` : ''}</span>`;
  renderMap(); renderTerritory(); renderWeek(); renderRecognition(); renderJournal();
  $('app').hidden = false;
}

// ---- incarcare + erori pe cod ----
function showError(e, retry) {
  const code = e?.code;
  const msg = {
    no_project: 'Nu găsesc proiectul „The Realm” în Todoist.',
    server_not_connected: 'Todoist nu e conectat. Adaugă-l din claude.ai, Settings → Connectors.',
    needs_reauth: 'Conexiunea la Todoist a expirat. Reconecteaz-o din claude.ai, Settings → Connectors.',
    not_in_manifest: 'Accesul la Todoist nu e permis pentru această pagină.',
    approval_required: 'Pagina are nevoie de aprobarea ta ca să citească Todoist.',
    selection_required: 'Ai mai multe conexiuni Todoist. Alege una în claude.ai.',
  }[code] || 'Nu am putut citi Todoist acum. Încearcă din nou în câteva minute.';
  $('status').innerHTML = `<p class="warn">${esc(msg)}</p>${retry ? '<button id="retry">Încearcă din nou</button>' : ''}`;
  $('status').hidden = false;
  $('retry')?.addEventListener('click', load);
}
let loading = false;
async function load() {
  if (loading) return; loading = true;
  try {
    const mcp = await window.claude?.use('mcp');
    if (!mcp) { showError({ code: 'none' }, false); $('status').innerHTML = '<p class="warn">Deschide pagina din claude.ai ca să se poată conecta la Todoist.</p>'; return; }
    const tasks = await fetchTasks(mcp);
    model = compute(tasks, new Date());
    $('status').hidden = true; render();
  } catch (e) { if (!model) showError(e, e?.code !== 'server_not_connected' && e?.code !== 'not_in_manifest'); }
  finally { loading = false; }
}
load();
setInterval(() => { if (!document.hidden && model) load(); }, 5 * 60000);
</script>
